name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests evals scripts
      - run: mypy -p app
        continue-on-error: true
      - run: pytest -q
      - run: python -m evals.run_evals --provider scripted
        env:
          TOOL_BACKOFF_S: "0.01"
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t incident-agent .
