# GitLab CI: mirrors .github/workflows/ci.yml
stages: [test, build]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

test:
  stage: test
  image: python:3.12-slim
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths: [.cache/pip]
  script:
    - pip install -r requirements-dev.txt
    - ruff check app tests evals scripts
    - mypy -p app
    - pytest -q tests/test_architecture.py
    - pytest -q
    - TOOL_BACKOFF_S=0.01 python -m evals.run_evals --provider scripted
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    - cd frontend && npm ci && npm run build && cd ..
    - playwright install --with-deps chromium
    - TOOL_BACKOFF_S=0.01 SCRIPTED_DELAY_S=0.12 python -m scripts.e2e_ui

frontend:
  stage: test
  image: node:22-alpine
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths: [frontend/node_modules]
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npm run format:check
    - npm run typecheck
    - npm test
    - npm run build

docker:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs: [test, frontend]
  script:
    - docker build -t incident-agent .
