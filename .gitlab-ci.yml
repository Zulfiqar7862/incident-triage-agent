# GitLab CI: mirrors .github/workflows/ci.yml (lint, tests, scripted evals, docker build)
stages: [test, build]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

test:
  stage: test
  image: python:3.12-slim
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths: [.cache/pip]
  script:
    - pip install -r requirements-dev.txt
    - ruff check app tests evals scripts
    - mypy -p app || true
    - pytest -q
    - TOOL_BACKOFF_S=0.01 python -m evals.run_evals --provider scripted

docker:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs: [test]
  script:
    - docker build -t incident-agent .
